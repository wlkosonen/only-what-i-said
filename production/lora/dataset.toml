# musubi-tuner dataset: 40 gallery plates of Claudia (claudia.gallery, used "as material" per use.md).
# Images and captions live in media/lora/dataset (gitignored); captions are in captions.jsonl here.
[general]
resolution = [1024, 1024]
caption_extension = ".txt"
batch_size = 1
enable_bucket = true
bucket_no_upscale = false

[[datasets]]
image_directory = "~/Claudia/media/lora/dataset"
cache_directory = "~/Claudia/media/lora/cache"
num_repeats = 1
